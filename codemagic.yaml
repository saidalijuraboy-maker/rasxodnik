workflows:
  ios-release-ipa:
    name: iOS Unsigned IPA
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign

      - name: Create IPA directly on macOS
        script: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r -9 app-release.ipa Payload
          mv app-release.ipa $CM_BUILD_DIR/

    artifacts:
      - "*.ipa"
