workflows:
  ios-release-ipa:
    name: iOS Unsigned IPA
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS IPA (Unsigned)
        script: |
          # Сборка приложения без требования сертификата разработчика Apple
          flutter build ipa --release --no-codesign

      - name: Package Application into IPA with Payload structure
        script: |
          # Создаём правильную структуру Payload/Runner.app для установки на устройство
          cd build/ios/archive/Runner.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../../../app-release.ipa Payload
          cd ../../../../../
          
          # Проверяем наличие созданного файла
          ls -la app-release.ipa

    artifacts:
      - app-release.ipa
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive
