workflows:
  ios-release:
name: Rashodnik iOS Release
max_build_duration: 120
instance_type: mac_mini_m2

environment:
  flutter: stable
  xcode: latest
  cocoapods: default

  ios_signing:
    distribution_type: app_store
    bundle_identifier: com.rashodnik.app

scripts:
  - name: Get Flutter packages
    script: |
      flutter pub get

  - name: Flutter analyze
    script: |
      flutter analyze

  - name: Install CocoaPods dependencies
    script: |
      cd ios
      pod install

  - name: Build iOS IPA
    script: |
      flutter build ipa --release

artifacts:
  - build/ios/ipa/*.ipa
  - /tmp/xcodebuild_logs/*.log

publishing:
  email:
    notify:
      success: true
      failure: true
